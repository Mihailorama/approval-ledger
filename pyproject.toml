[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "approval-ledger"
version = "0.1.0"
description = "Hash-bound human approval and idempotent dispatch for automated actions."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mihailorama" }]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
]

[project.urls]
Homepage = "https://github.com/mihailorama/approval-ledger"
Repository = "https://github.com/mihailorama/approval-ledger"

[tool.hatch.build.targets.wheel]
packages = ["src/approval_ledger"]
